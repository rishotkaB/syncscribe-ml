[project]
name = "syncscribe-ml"
version = "0.1.0"
description = "ML-часть SyncScribe: определение затронутых фрагментов и черновики правок"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
