[project]
name = "syncscribe-ml"
version = "0.1.0"
description = "ML-часть SyncScribe: определение затронутых фрагментов и черновики правок"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Чтение .docx и .pdf (тяжёлая зависимость, тянет torch). Для .md/.txt не нужна.
docling = ["docling>=2"]
# BGE-M3 прямо в Python, без Ollama (тянет torch). Модель скачается с Hugging Face при первом запуске.
local = ["sentence-transformers>=3"]
# HTTP-сервис для SyncBack (src/syncscribe_ml/server.py).
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
